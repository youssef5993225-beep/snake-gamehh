<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدودة </title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #2ecc71; margin-bottom: 5px; }
        #score-board {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #1e1e1e;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
            display: block;
            margin: 0 auto;
        }
        .instructions {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>لعبة الدودة</h1>
    <div id="score-board">النقاط: <span id="score">0</span> | أعلى نقاط: <span id="highScore">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="instructions">
        <p>التحكم: الأسهم (Arrow Keys) أو W, A, S, D | للإيقاف/البدء: اضغط <b>Space</b></p>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gridSize = 20;
const tileCount = 20;

let snake = [{x: 10, y: 10}];
let dx = 1;
let dy = 0;

let food = {x: 5, y: 5, type: 'normal'};
let score = 0;
let highScore = localStorage.getItem('snakeHighScore') || 0;
document.getElementById('highScore').innerText = highScore;

let normalApplesEaten = 0;
let isPaused = false;
let gameOver = false;

// توليد الطعام
function spawnFood() {
    let fx = Math.floor(Math.random() * tileCount);
    let fy = Math.floor(Math.random() * tileCount);
    
    // كل 3 تفاحات عادية، نظهر التفاحة الخاصة (الذهبية بـ 3 نقاط)
    let fType = 'normal';
    if (normalApplesEaten > 0 && normalApplesEaten % 3 === 0) {
        fType = 'special';
    }
    food = {x: fx, y: fy, type: fType};
}

// التحكم باللوحة المفاتيح
document.addEventListener("keydown", changeDirection);

function changeDirection(event) {
    if (event.code === "Space") {
        if (gameOver) {
            resetGame();
            return;
        }
        isPaused = !isPaused;
        return;
    }

    if (isPaused || gameOver) return;

    const keyPressed = event.keyCode;
    const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
    
    // دعم الأسهم وحروف W, A, S, D
    if ((keyPressed === LEFT || event.key === 'a' || event.key === 'A') && dx === 0) {
        dx = -1; dy = 0;
    }
    if ((keyPressed === UP || event.key === 'w' || event.key === 'W') && dy === 0) {
        dx = 0; dy = -1;
    }
    if ((keyPressed === RIGHT || event.key === 'd' || event.key === 'D') && dx === 0) {
        dx = 1; dy = 0;
    }
    if ((keyPressed === DOWN || event.key === 's' || event.key === 'S') && dy === 0) {
        dx = 0; dy = 1;
    }
}

function main() {
    if (gameOver || isPaused) return;

    setTimeout(() => {
        clearCanvas();
        drawFood();
        moveSnake();
        drawSnake();
        checkGameOver();
        main();
    }, 100);
}

function clearCanvas() {
    ctx.fillStyle = "#1e1e1e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawSnake() {
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#27ae60" : "#2ecc71";
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
    });
}

function moveSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};

    // ميزة الانتقال عبر الجدران (Wrap Around)
    if (head.x < 0) head.x = tileCount - 1;
    if (head.x >= tileCount) head.x = 0;
    if (head.y < 0) head.y = tileCount - 1;
    if (head.y >= tileCount) head.y = 0;

    snake.unshift(head);

    // أكل التفاحة
    if (head.x === food.x && head.y === food.y) {
        if (food.type === 'special') {
            score += 3;
        } else {
            score += 1;
            normalApplesEaten++;
        }
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            document.getElementById('highScore').innerText = highScore;
        }
        document.getElementById('score').innerText = score;
        spawnFood();
    } else {
        snake.pop();
    }
}

function drawFood() {
    if (food.type === 'special') {
        ctx.fillStyle = "#f1c40f"; // تفاحة ذهبية بـ 3 نقاط
    } else {
        ctx.fillStyle = "#e74c3c"; // تفاحة عادية بنقطة
    }
    ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
}

function checkGameOver() {
    const head = snake[0];
    // الموت فقط لو أكل ديله
    for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            gameOver = true;
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = "16px Arial";
            ctx.fillText("اضغط Space للبدء من جديد", canvas.width / 2, canvas.height / 2 + 30);
        }
    }
}

function resetGame() {
    snake = [{x: 10, y: 10}];
    dx = 1;
    dy = 0;
    score = 0;
    normalApplesEaten = 0;
    document.getElementById('score').innerText = score;
    gameOver = false;
    spawnFood();
    main();
}

spawnFood();
main();
</script>

</body>
</html>
